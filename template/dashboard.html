<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>reTerminal dashboard – template</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<!--
  800×480 background for the reTerminal E1001.
  Query parameters (for development):
    ?data=URL      data file (default ../data.json)
    ?holes=demo    fill the device-drawn holes with sample values
    ?holes=outline show hole outlines
    ?bw=1          preview the 1-bit threshold
-->
<body>
  <main id="screen">
    <!-- top band: METAR | date + clock (device) | indoor + battery (device) -->
    <section id="metar">
      <div class="metar-head"><span data-bind="station"></span> · <span data-bind="metarTime"></span></div>
      <div class="metar-main">
        <div class="metar-temp" data-bind="metarTemp"></div>
        <div class="metar-rh" data-bind="metarRh"></div>
      </div>
      <div class="metar-wind-name fit" data-bind="windName"></div>
      <div class="metar-wind" data-bind="wind"></div>
    </section>

    <section id="center">
      <div class="date" data-bind="date"></div>
      <!-- clock hole below -->
    </section>

    <section id="indoor">
      <svg class="house" width="30" height="28" viewBox="0 0 30 28"><path d="M3 13 L15 3 L27 13 M7 10 V25 H23 V10" fill="none" stroke="#000" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="12" y="16" width="6" height="9" fill="#000"/></svg>
      <!-- indoor + battery holes -->
    </section>

    <section id="hours"></section>
    <section id="days"></section>

    <!-- device-drawn areas (empty in the rendered background) -->
    <div id="holes"></div>
  </main>

  <svg width="0" height="0" style="position:absolute">
    <filter id="threshold" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0 0 0 0 1 1 1"/>
        <feFuncG type="discrete" tableValues="0 0 0 0 0 1 1 1"/>
        <feFuncB type="discrete" tableValues="0 0 0 0 0 1 1 1"/>
      </feComponentTransfer>
    </filter>
  </svg>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
