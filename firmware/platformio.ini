; reTerminal E1001 dashboard firmware
; Build + flash:  pio run -e usb -t upload      (or -e battery / -e battery_deep)
; Serial log:     pio device monitor

[env]
platform = espressif32@^6.9.0
framework = arduino
; Seeed's Arduino guide uses the XIAO ESP32S3 board definition (ESP32-S3, 8 MB flash map, OPI PSRAM)
board = seeed_xiao_esp32s3
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  zinggjm/GxEPD2@^1.6.4
  adafruit/Adafruit GFX Library@^1.11.11
build_flags =
  -DCORE_DEBUG_LEVEL=1

; Always on (USB power): stays awake, partial refresh every minute, no night pause.
[env:usb]
build_flags = ${env.build_flags} -DPOWER_MODE=0

; Battery, light sleep between minutes. Display controller stays powered -> clean partial refreshes.
[env:battery]
build_flags = ${env.build_flags} -DPOWER_MODE=1

; Battery, deep sleep (~14 uA) between minutes. Lowest power; partial refresh after deep sleep is
; EXPERIMENTAL (see README "Deep sleep and partial refresh").
[env:battery_deep]
build_flags = ${env.build_flags} -DPOWER_MODE=2
