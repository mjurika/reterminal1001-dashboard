name: render

# Fetches METAR + forecast, renders the dashboard background and publishes it to GitHub Pages.
on:
  schedule:
    # LZIB METAR is observed at :00 and :30. GitHub usually starts scheduled runs late; if a run starts
    # before the new METAR is published, "fetch --wait-metar" waits for it (up to 10 min).
    - cron: '1,31 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['template/**', 'src/**', 'preview/**', 'layout.json', 'config.json', 'package*.json', '.github/workflows/render.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium + system libraries preinstalled; the tag must match the "playwright" version in package.json (checked by npm test).
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch -- --wait-metar=10
      - run: npm run render
      - run: npm run site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
