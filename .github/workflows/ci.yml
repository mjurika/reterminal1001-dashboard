name: ci

# Tests + render from fixtures (no network needed). The rendered PNG is attached as an artifact.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: |
            out/dashboard.png
            out/raw.png
            out/meta.json
